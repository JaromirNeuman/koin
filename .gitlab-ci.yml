image: node:20-alpine

stages:
  - install
  - lint
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

install_dependencies:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

run_lint:
  stage: lint
  script:
    - npm run lint
  dependencies:
    - install_dependencies

run_build:
  stage: build
  variables:
    NEXT_PUBLIC_SUPABASE_URL: "https://fake.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY: "fake-key"
    OPENAI_API_KEY: "fake-key"
  script:
    - npm run build
  dependencies:
    - install_dependencies